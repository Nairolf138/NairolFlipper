name: Bug
description: Signaler un comportement incorrect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Résumé
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build / commit
  - type: dropdown
    id: platform
    attributes:
      label: Plateforme
      options: [Web, Android, iOS, Windows, macOS, Linux, Autre]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Comportement observé
    validations:
      required: true
