name: Godot P0 validation

on:
  push:
    branches: [main, hermes-autonomous]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Stamp tested build identity
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/scripts/stamp_build.py --source-commit "$SOURCE_COMMIT" --run-number "$GITHUB_RUN_NUMBER" --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          install -m 0755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.7.2.stable/
      - name: Import clean project
        run: |
          mkdir -p build/web build/android build/windows build/logs
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee build/logs/import.log
          bash .github/scripts/assert_clean_godot_log.sh build/logs/import.log
      - name: Python contract tests
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest tests/ -q
      - name: Godot behavioral tests
        run: |
          set -o pipefail
          godot --headless --display-driver headless --audio-driver Dummy --path . --script res://tests/godot/test_runner.gd 2>&1 | tee build/logs/behavioral-tests.log
          bash .github/scripts/assert_clean_godot_log.sh build/logs/behavioral-tests.log
      - name: Qualification lifecycle and local report tests
        run: |
          set -o pipefail
          godot --headless --display-driver headless --audio-driver Dummy --path . --script res://tests/godot/qualification_runner.gd 2>&1 | tee build/logs/qualification-tests.log
          bash .github/scripts/assert_clean_godot_log.sh build/logs/qualification-tests.log
      - name: Headless project smoke test
        run: |
          set -o pipefail
          godot --headless --display-driver headless --audio-driver Dummy --path . --quit-after 5 2>&1 | tee build/logs/smoke.log
          bash .github/scripts/assert_clean_godot_log.sh build/logs/smoke.log
      - name: Render playfield inspection captures
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1200x2100x24" godot --display-driver x11 --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --path . --fixed-fps 60 --script res://tests/godot/capture_playfield.gd 2>&1 | tee build/logs/visuals.log
          bash .github/scripts/assert_clean_godot_log.sh build/logs/visuals.log
      - name: Upload playfield inspection captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nairolflipper-playfield-captures
          path: |
            build/visuals/
            build/logs/visuals.log
          if-no-files-found: error
      - name: Export Web
        run: |
          set -o pipefail
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee build/logs/export-web.log
          bash .github/scripts/assert_clean_godot_log.sh build/logs/export-web.log
      - name: Export Android debug APK
        run: |
          set -o pipefail
          godot --headless --path . --export-debug "Android" build/android/nairolflipper-debug.apk 2>&1 | tee build/logs/export-android.log
          bash .github/scripts/assert_clean_godot_log.sh build/logs/export-android.log
      - name: Export Windows
        run: |
          set -o pipefail
          godot --headless --path . --export-release "Windows Desktop" build/windows/NairolFlipper.exe 2>&1 | tee build/logs/export-windows.log
          bash .github/scripts/assert_clean_godot_log.sh build/logs/export-windows.log
      - name: Verify and package Alpha candidate evidence
        run: python3 .github/scripts/package_qualification.py
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nairolflipper-android-debug
          path: build/android/nairolflipper-debug.apk
          if-no-files-found: error
      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: nairolflipper-web
          retention-days: 14
          path: build/web/
          if-no-files-found: error
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: nairolflipper-windows
          retention-days: 14
          path: build/windows/
          if-no-files-found: error
      - name: Upload Alpha candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: nairolflipper-alpha-qualification
          retention-days: 14
          path: |
            build/qualification/
            build/logs/
          if-no-files-found: error
